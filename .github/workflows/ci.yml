name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  shellcheck:
    name: ShellCheck (home/bin/, cloud/, tests/)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          scandir: './home/bin'
      # cloud/ is fetched over the network and piped to a shell in every
      # sandbox, so it is the code most in need of linting, not the least.
      - name: Run ShellCheck (cloud/)
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          scandir: './cloud'
      - name: Run ShellCheck (tests/)
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          scandir: './tests'

  credential-helper:
    name: gcp-credentials behaviour
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The helper ships to every cloud sandbox via the bootstrap fetch and to
      # every laptop via chezmoi, so a regression here has no staging tier.
      - name: Run the credential-helper tests
        run: sh tests/gcp-credentials-test.sh
      # The hook fires on every Bash call, so what it does and does not
      # classify as a commit/push is the whole of its cost.
      - name: Run the pre-commit hook classification tests
        run: sh tests/precommit-hook-test.sh

  context-composition:
    name: composed context profiles
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ADR-0018 principle 7. Deterministic delivery trades runtime
      # adaptability for build-time correctness, which is only a good trade if
      # something checks the build: a mis-composed profile is wrong on one
      # surface only, and a surface nobody used this week is a surface nobody
      # is watching. Verifies committed outputs match their fragments, that no
      # profile carries another environment's fragment, and reports the
      # always-loaded line count against the budget.
      - name: Composed profiles must match their fragments
        run: python3 tests/compose-context.py

  allowlist-coverage:
    name: allowlist covers documented commands
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A permission rule that stops matching fails invisibly: nothing errors,
      # the user just gets a prompt, and a prompt looks like normal life.
      - name: Every helper invocation must be covered by an allow rule
        run: python3 tests/allowlist-covers-commands.py

  actionlint:
    name: Action Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Pinned release + checksum, rather than piping an install script from a
    # mutable `main` ref into bash. ADR-0016 principle 6 forbids exactly that
    # pattern for this repo's own bootstrap, on the grounds that a mutable ref
    # hands a third party reach into the environment; CI is not an exception.
    # The upstream download script performs no verification of its own.
    #
    # Bump VERSION and SHA256 together. The checksum is the publisher's, from
    # actionlint_<version>_checksums.txt in the same release.
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and verify actionlint
        run: |
          set -euo pipefail
          file="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$file" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${file}"
          echo "${ACTIONLINT_SHA256}  ${file}" | sha256sum --check --strict -
          tar -xzf "$file" actionlint
      - name: Run actionlint
        run: ./actionlint -color

  gitleaks:
    name: Gitleaks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN no longer grants pull-requests: read, and
    # gitleaks-action needs it in PR context to fetch the PR's commit list —
    # without it the first PR run fails 403. Job-level to stay least-privilege.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Full history: a secret is only interesting if it was ever committed,
      # and a shallow clone cannot see that.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  retired-paths:
    name: retired-paths validity
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Entries must be safe and correctly sectioned
        run: sh tests/retired-paths.sh
      - name: The validator itself must catch a bad entry
        run: sh tests/retired-paths-test.sh

  settings-sync:
    name: settings.json ↔ settings.json.md sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify both files change together
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base"..HEAD || true)
          json_changed=$(printf '%s\n' "$changed" | grep -c '^home/settings\.json$' || true)
          md_changed=$(printf '%s\n' "$changed" | grep -c '^home/settings\.json\.md$' || true)
          if [ "$json_changed" -ne "$md_changed" ]; then
            echo "::error::home/settings.json and home/settings.json.md must change together."
            echo "  home/settings.json changed:    $json_changed"
            echo "  home/settings.json.md changed: $md_changed"
            echo ""
            echo "JSON does not allow comments, so settings.json.md is the annotated companion."
            echo "Any rule added/removed/edited in one must be reflected in the other."
            exit 1
          fi
          if [ "$json_changed" -eq 0 ]; then
            echo "Neither file changed in this PR — sync trivially holds."
          else
            echo "Both files changed — sync OK."
          fi
