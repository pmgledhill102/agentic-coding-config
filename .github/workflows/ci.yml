name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@ce4853d43830c74c1753b39f3cf40f71c2031eb9 # v19
        with:
          globs: "**/*.md"

  shellcheck:
    name: ShellCheck (home/bin/, cloud/)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          scandir: './home/bin'
      # cloud/ is fetched over the network and piped to a shell in every
      # sandbox, so it is the code most in need of linting, not the least.
      - name: Run ShellCheck (cloud/)
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          scandir: './cloud'
      - name: Run ShellCheck (tests/)
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          scandir: './tests'

  credential-helper:
    name: gcp-credentials behaviour
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The helper ships to every cloud sandbox via the bootstrap fetch and to
      # every laptop via chezmoi, so a regression here has no staging tier.
      - name: Run the credential-helper tests
        run: sh tests/gcp-credentials-test.sh

  actionlint:
    name: Action Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Run actionlint
        run: ./actionlint -color

  retired-paths:
    name: retired-paths validity
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Entries must be safe and actually retired
        run: |
          set -eu
          list=home/retired-paths
          if [ ! -f "$list" ]; then
            echo "$list not present — nothing to validate."
            exit 0
          fi
          rc=0
          while IFS= read -r line || [ -n "$line" ]; do
            path=$(printf '%s' "$line" | sed 's/[[:space:]]*$//')
            case "$path" in
              '' | '#'*) continue ;;
            esac
            # Must not escape ~/.claude/ — the pruner refuses these too, but
            # failing here means a bad entry never reaches a machine.
            case "$path" in
              /* | *..*)
                echo "::error file=$list::unsafe entry (absolute or ..): $path"
                rc=1
                continue
                ;;
            esac
            # The whole point is that the file is GONE from home/. An entry
            # that still exists would have the pruner delete a live file on
            # every apply, and chezmoi restore it on the next one.
            if [ -e "home/$path" ]; then
              echo "::error file=$list::still present in home/ — retire the file first, or drop this entry: $path"
              rc=1
            fi
          done < "$list"
          if [ "$rc" -eq 0 ]; then
            echo "All retired-paths entries are safe and refer to removed files."
          fi
          exit "$rc"

  settings-sync:
    name: settings.json ↔ settings.json.md sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Verify both files change together
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base"..HEAD || true)
          json_changed=$(printf '%s\n' "$changed" | grep -c '^home/settings\.json$' || true)
          md_changed=$(printf '%s\n' "$changed" | grep -c '^home/settings\.json\.md$' || true)
          if [ "$json_changed" -ne "$md_changed" ]; then
            echo "::error::home/settings.json and home/settings.json.md must change together."
            echo "  home/settings.json changed:    $json_changed"
            echo "  home/settings.json.md changed: $md_changed"
            echo ""
            echo "JSON does not allow comments, so settings.json.md is the annotated companion."
            echo "Any rule added/removed/edited in one must be reflected in the other."
            exit 1
          fi
          if [ "$json_changed" -eq 0 ]; then
            echo "Neither file changed in this PR — sync trivially holds."
          else
            echo "Both files changed — sync OK."
          fi
