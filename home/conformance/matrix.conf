# Capability matrix: the platform behaviours this repo rests on, as data.
#
# Read by ~/.claude/bin/env-conformance, which probes each entry and reports
# pass / FAIL / unproven / unknown. Design, statuses and the baseline:
# docs/environment-conformance.md. Tracking: #260.
#
# A skill or doc that relies on one of these facts should cite the entry id
# rather than restate the measurement, because a restated measurement goes
# stale with nothing to say so; this file is re-measured.
#
# FORMAT. One stanza per assertion, `[id]` then key=value lines. Every key is
# required; tests/env-conformance-test.sh rejects a stanza missing one.
#
#   mode      fast = cheap, no human, no approvals: start-session runs these.
#             full = only in a full run. A probe needing a human never goes in
#             this file at all; it belongs to the scheduled run (#655).
#   surface   which surface the expectation was measured on. Entries for
#             another surface are skipped, not failed.
#   probe     <function> <args...>, split on whitespace. A leading ~/ in an
#             argument is $HOME. Functions are the probe_* in env-conformance.
#   expect    the observation the claim predicts.
#   control   the SAME function with an input that must observe something
#             else. It is what proves the probe can fail: a pass whose control
#             also matches the expectation is reported unproven, never pass.
#   measured  the date expect was last observed to hold.
#   claim     the fact, in words.
#   depends   what becomes false if the claim does. Printed on FAIL, so a
#             regression points at the decision rather than at a red line.

# --- fast: cheap enough to run at every session start -------------------------

[os-ubuntu-2404]
mode=fast
surface=claude-cloud
probe=os /etc/os-release
expect=ubuntu-24.04
control=os /dev/null
measured=2026-10-20
claim=The sandbox image is Ubuntu 24.04
depends=context/fragments/os-ubuntu.md composed into the cloud profiles; ADR-0020 surface matrix

[binsh-dash]
mode=fast
surface=claude-cloud
probe=sh_impl /bin/sh
expect=dash
control=sh_impl /bin/true
measured=2026-10-20
claim=/bin/sh is dash, so a bashism under #!/bin/sh fails here
depends=core policy "Target POSIX sh" (the macOS/dash asymmetry); CI shellcheck-by-shebang

[tool-jq]
mode=fast
surface=claude-cloud
probe=tool jq
expect=present
control=tool conformance-no-such-tool
measured=2026-10-20
claim=jq is on PATH in the base image
depends=cloud/bootstrap.sh --with-hooks settings merge (dies without jq); session-cache-verdict; start-session-gather-state gh sections

[tool-gh]
mode=fast
surface=claude-cloud
probe=tool gh
expect=present
control=tool conformance-no-such-tool
measured=2026-10-20
claim=gh is on PATH (preinstalled and proxy-preconfigured; #260 originally recorded it absent)
depends=start-session-gather-state REST probe and repo_archived; end-session-gather-state; start-session §Surface

[egress-raw-github]
mode=fast
surface=claude-cloud
probe=egress https://raw.githubusercontent.com/
expect=reached
control=egress https://conformance.invalid/
measured=2026-10-20
claim=raw.githubusercontent.com is reachable from the sandbox
depends=cloud/bootstrap.sh fetch() of every skill, helper, standard and policy file; ADR-0016 delivery channel

[gh-rest-origin]
mode=fast
surface=claude-cloud
probe=gh_lane rest @origin
expect=ok
control=gh_lane rest pmgledhill102/conformance-no-such-repo
measured=2026-10-20
claim=Repo-scoped REST (gh api repos/<origin>) is allowed through the proxy
depends=start-session-gather-state repo_archived probe; start-session §Surface REST lane; #273, #276, #601, #619

[gh-graphql-blocked]
mode=fast
surface=claude-cloud
probe=gh_lane graphql
expect=blocked
control=gh_lane rest @origin
measured=2026-10-20
claim=GitHub GraphQL is blocked for every Claude Code session
depends=start-session §Surface (issue data via MCP, not gh issue list); start-session-gather-state GH_ISSUES_API probe; #550

[hook-sessionstart-fires]
mode=fast
surface=claude-cloud
probe=hook_fired ~/.agents/.session-marker ~/.claude/settings.json session-cache-verdict
expect=this-session
control=hook_fired ~/.agents/conformance-no-such-marker ~/.claude/settings.json session-cache-verdict
measured=2026-10-20
claim=Hooks in a container-written ~/.claude/settings.json fire (SessionStart observed by its marker)
depends=#254 harness enforcement; cloud/bootstrap.sh --with-hooks; credguard as the only credential guard on this surface (#440); session-cache-verdict (#430)

[env-cloudsdk-token-preset]
mode=fast
surface=claude-cloud
probe=env_set CLOUDSDK_AUTH_ACCESS_TOKEN
expect=set
control=env_set CONFORMANCE_NO_SUCH_VAR
measured=2026-10-20
claim=The environment presets CLOUDSDK_AUTH_ACCESS_TOKEN, outside our control
depends=#377; cloud/bootstrap.sh cap_gcloud wrapper (strips it); gcp-credentials gcloud_env_conflicts

